<nav class="navbar-shell">
  <div class="brand-block">
    <img src="holcim-logo.png" alt="Trucking Truck" class="logo" />
    <div class="brand-copy">
      <p class="eyebrow">Control Tower</p>
      <span>Trucking Truck</span>
    </div>
  </div>

  <div class="action-block">
    <div class="status-pill">
      <i class="fas fa-circle"></i>
      <span>{{ notificationCount() }} activités</span>
    </div>

    <div class="menu-anchor">
      <button class="icon-button" type="button" aria-label="Notifications" (click)="toggleNotifications()">
        <i class="fas fa-bell"></i>
        <span class="badge">{{ notificationCount() }}</span>
      </button>

      @if (notificationsOpen()) {
        <div class="dropdown-panel notifications-panel">
          <div class="dropdown-header">
            <strong>Notifications</strong>
            <span>{{ notificationCount() }} non lues</span>
          </div>

          <button class="dropdown-link link-action" type="button" (click)="markAllAsRead()">
            Tout marquer comme lu
          </button>

          <div class="dropdown-list">
            <div class="dropdown-item" *ngFor="let notification of notifications()">
              <button type="button" class="notification-entry" (click)="openNotification(notification)">
                <span class="notification-dot" [class.unread]="notification.unread"></span>
                <div>
                  <strong>{{ notification.title }}</strong>
                  <p>{{ notification.message }}</p>
                  <small>{{ notification.service }}</small>
                </div>
                <i class="fas fa-arrow-right"></i>
              </button>
            </div>
          </div>

          <a routerLink="/dashboard/cartographie" class="dropdown-link" (click)="closeMenus()">
            Ouvrir la cartographie
          </a>
        </div>
      }
    </div>

    <div class="menu-anchor">
      <button class="profile-card" type="button" (click)="toggleProfile()">
        <span class="profile-avatar"><i class="fas fa-user-tie"></i></span>
        <div>
          <strong>{{ displayName() }}</strong>
          <small>{{ roleLabel() }}</small>
        </div>
      </button>

      @if (profileOpen()) {
        <div class="dropdown-panel profile-panel">
          <div class="dropdown-header profile-header">
            <div>
              <strong>{{ displayName() }}</strong>
              <span>{{ roleLabel() }}</span>
            </div>
            <i class="fas fa-id-card"></i>
          </div>

          <div class="profile-form">
            <label>Prénom</label>
            <input type="text" [ngModel]="profileDraft().prenom" (ngModelChange)="updateProfileField('prenom', $event)" />

            <label>Nom</label>
            <input type="text" [ngModel]="profileDraft().nom" (ngModelChange)="updateProfileField('nom', $event)" />

            <label>Email</label>
            <input type="email" [ngModel]="profileDraft().email" (ngModelChange)="updateProfileField('email', $event)" />
          </div>

          <button type="button" class="dropdown-link" (click)="saveProfile()">Enregistrer le profil</button>
          <button type="button" class="dropdown-link" (click)="openPasswordChange()">Modifier le mot de passe</button>

          <a routerLink="/dashboard" class="dropdown-link" (click)="closeMenus()">Tableau de bord</a>
          <a routerLink="/dashboard/expedition" class="dropdown-link" (click)="closeMenus()">Service expédition</a>
          <button type="button" class="dropdown-link danger" (click)="logout()">Déconnexion</button>
        </div>
      }
    </div>
  </div>
</nav>
