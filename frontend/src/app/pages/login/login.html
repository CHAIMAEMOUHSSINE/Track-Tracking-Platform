<div class="login-container">
  <div class="login-surface">
    <section class="login-hero">
      <img src="/holcim-logo.png" alt="Holcim Maroc" class="brand-logo" />
      <p class="eyebrow">Trucking Intelligence</p>
      <h1>Pilotage des flux camions en temps réel</h1>
      <p>
        Un espace de supervision clair pour suivre la flotte, les alertes et la cartographie logistique.
      </p>
    </section>

    <section class="login-card">
      <div class="card-header">
        <h2>Connexion sécurisée</h2>
        <span>Accès opérateur</span>
      </div>

      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="email">Email professionnel</label>
          <input
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="prenom.nom@holcim.ma"
            required>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required>
        </div>

        <button type="submit">Se connecter</button>
      </form>
    </section>
  </div>
</div>
